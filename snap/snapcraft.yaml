name: likhit
title: Likhit
summary: Turn handwritten pages into a Word document
description: |
  Likhit converts photos of handwritten pages (or scanned PDFs) into an editable Word (.docx) document.

  It offers three reading modes and picks the best one available automatically:
  - Cloud AI: uses an API key (OpenAI, Anthropic Claude, Google Gemini, or any OpenAI-compatible service) for highest accuracy.
  - Local LLM: runs a vision model (e.g., qwen2.5vl) on your own machine via Ollama or LM Studio. Nothing leaves your computer; no internet required.
  - Without AI (offline OCR): falls back to Tesseract OCR. Fully offline, fast, but optimized for printed text.

  You can also force a specific mode from the "Read with" menu.

  Privacy: In Local LLM and Offline modes, Likhit works fully offline. No handwriting images or text ever leave your machine. Cloud mode sends images to your chosen API provider only when you explicitly provide a key and select that mode.

  Features: real Word headings, bullet lists, paragraph rejoining, yellow highlight for unclear words ([?]), optional original photo under each page, page breaks, KP logo watermark in document header.
license: GPL-3.0-or-later
contact: kanakprabhakar72@gmail.com
website: https://github.com/Kanak234/likhit
source-code: https://github.com/Kanak234/likhit
issues: https://github.com/Kanak234/likhit/issues
icon: snap/gui/likhit.png

base: core24
confinement: strict
grade: stable
# WHY: version comes from pyproject.toml, so the snap and the app never disagree
#      (git describe gave things like "1.1.0-2-g4b5be0b-dirty").
adopt-info: app

# WHY: amd64 only for the first release. arm64 can be added later once amd64 is live.
platforms:
  amd64:

parts:
  # Python deps (python-docx, Pillow, pytesseract, PyMuPDF, keyring) from pyproject.toml,
  # plus the runtime programs the app calls: Tk for the window, Tesseract for offline OCR.
  likhit:
    plugin: python
    source: .
    stage-packages:
      # WHAT: tkinter/ + _tkinter.so for python 3.12 (core24's python has no Tk).
      # WHERE: lands in $SNAP/usr/lib/python3.12 -> added to PYTHONPATH in apps.likhit.
      - python3-tk
      # WHAT: offline OCR engine + English model. pytesseract runs the "tesseract" binary.
      - tesseract-ocr
      - tesseract-ocr-eng
    # NOTE: no libmupdf here. The PyMuPDF wheel bundles MuPDF, and Ubuntu 24.04 has no
    #       "libmupdf" runtime package (that line made the build fail).
    build-packages:
      - python3-dev

  # WHY: ship the real source tree (main.py + likhit/ + assets/) so paths resolve like in the repo.
  # WHAT: copy only what the app needs into $SNAP/app.
  # WHERE: used by apps.likhit.command below.
  app:
    plugin: dump
    source: .
    organize:
      main.py: app/main.py
      likhit: app/likhit
      assets: app/assets
    stage:
      - app/main.py
      - app/likhit
      - app/assets
      - -app/likhit/**/__pycache__
    override-pull: |
      craftctl default
      # WHERE: read version = "x.y.z" from pyproject.toml -> snap version
      VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
      craftctl set version="${VERSION:-1.1.0}"

apps:
  likhit:
    # WHY: likhit/docx_writer.py finds assets at <repo>/assets (parent of the package).
    #      A pip-installed copy lives in site-packages where no assets/ exists, so the KP
    #      watermark and icons would be missing. We run the app from the dumped source tree.
    command: bin/python3 $SNAP/app/main.py
    # WHAT: gnome extension = GTK/desktop libs, fonts, themes, display access for the Tk window.
    extensions: [gnome]
    common-id: io.github.Kanak234.Likhit
    plugs:
      - home              # open photos / save .docx in the user's home folder
      - removable-media   # photos on USB drives and SD cards
      - network           # Cloud AI and Local LLM (Ollama / LM Studio on localhost) modes
    environment:
      # WHAT: Tesseract 5 language data (Ubuntu 24.04 path).
      TESSDATA_PREFIX: $SNAP/usr/share/tesseract-ocr/5/tessdata
      # WHAT: tkinter + _tkinter staged from python3-tk, the app source, and venv packages.
      PYTHONPATH: $SNAP/app:$SNAP/usr/lib/python3.12:$SNAP/usr/lib/python3.12/lib-dynload:$SNAP/lib/python3.12/site-packages
      # WHAT: Tcl/Tk script libraries (Tk will not start without them).
      TCL_LIBRARY: $SNAP/usr/share/tcltk/tcl8.6
      TK_LIBRARY: $SNAP/usr/share/tcltk/tk8.6
      # WHAT: staged shared libs (libtk, libtcl, tesseract, leptonica).
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack:${LD_LIBRARY_PATH}
