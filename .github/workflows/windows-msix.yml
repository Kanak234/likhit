# Builds the Microsoft Store package of Likhit on a real Windows machine.
# Trigger: push a tag like v2.0.0, or run it manually (Actions → windows-msix → Run).
# Output artifacts: Likhit-<ver>.msix (upload to Partner Center) + portable .zip.
name: windows-msix
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller python-docx
      - name: Download Tesseract OCR + checksum
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packaging\windows\fetch_tesseract.ps1
      - name: Build MSIX (includes offline OCR smoke test)
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
        run: packaging\windows\build_msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: likhit-windows
          path: |
            dist/*.msix
            dist/*.zip
            tesseract/MANIFEST.json
