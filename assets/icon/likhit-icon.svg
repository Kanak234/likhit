<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Likhit app icon (original design for Kanak Prabhakar).
       Idea: a handwritten loop on a page turns into clean typed lines = handwriting -> Word document. -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B3BC4"/>
      <stop offset="1" stop-color="#1F1A5C"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC15E"/>
      <stop offset="1" stop-color="#FF7A2F"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B0830" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- rounded-square tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- soft top highlight -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)"/>

  <!-- the page -->
  <g filter="url(#sh)">
    <rect x="118" y="92" width="244" height="316" rx="26" fill="#FBFAFF"/>
    <!-- folded corner -->
    <path d="M314 92 H336 Q362 92 362 118 V140 Z" fill="#DCD6FF"/>
  </g>

  <!-- handwriting (top half): a flowing cursive stroke -->
  <path d="M150 178
           C168 140, 196 140, 196 168
           C196 196, 172 206, 168 186
           C164 166, 206 150, 228 172
           C246 190, 238 210, 226 202
           C214 194, 236 156, 262 168
           C284 178, 288 196, 300 192
           C312 188, 318 176, 326 172"
        fill="none" stroke="#4B3BC4" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- transition arrow dots -->
  <circle cx="200" cy="246" r="7" fill="#B9B0F5"/>
  <circle cx="240" cy="246" r="7" fill="#9A8EEF"/>
  <circle cx="280" cy="246" r="7" fill="#7A6BE6"/>

  <!-- typed lines (bottom half) -->
  <rect x="150" y="286" width="176" height="16" rx="8" fill="#2A2470"/>
  <rect x="150" y="318" width="150" height="16" rx="8" fill="#2A2470" opacity="0.85"/>
  <rect x="150" y="350" width="120" height="16" rx="8" fill="#2A2470" opacity="0.7"/>

  <!-- pen nib -->
  <g transform="translate(372 352) rotate(40)">
    <path d="M-30 -96 H30 V-10 L0 46 L-30 -10 Z" fill="url(#nib)"/>
    <path d="M0 46 L0 -4" stroke="#7A2E00" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-14" r="9" fill="#7A2E00"/>
    <rect x="-30" y="-120" width="60" height="30" rx="8" fill="#FFE2B0"/>
  </g>
</svg>
